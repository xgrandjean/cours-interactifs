<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcours Pédagogique - Cours Interactifs</title>

    <script>window._ELECTRON_DEPTH = 2;</script>
    <script src="../../src/js/config.js"></script>

    <!-- Stocker le slug du parcours dans sessionStorage pour detectSlug() -->
    <script>
    (function() {
        var p = new URLSearchParams(window.location.search).get('parcours');
        if (p) {
            sessionStorage.setItem('parcours:current:slug', p);
        }
    })();
    </script>

    <!-- parcours.js -->
    <script src="../../src/js/parcours.js"></script>

    <!-- Garde d'auth immédiate — avant tout rendu -->
    <script>
    (function() {
        if (!Parcours.token) {
            window.location.replace(Parcours.loginUrl);
        }
    })();
    </script>

    <link rel="stylesheet" href="../../src/assets/css/style.css">
    <link rel="stylesheet" href="../../src/assets/css/index.css">
</head>
<body style="opacity:0; transition:opacity 0.2s ease;">
    <header>
        <div class="container">
            <h1 id="parcours-title">Parcours Pédagogique</h1>
            <p class="subtitle">Apprenez pas à pas avec des QCM interactifs</p>
        </div>
    </header>

    <main class="container">
        <div id="student-info" class="student-info" style="display:none;">
            <div class="welcome-message">
                <div class="student-details">
                    <div class="student-info-left">
                        <span class="student-name"></span>
                        <span class="student-class"></span>
                    </div>
                    <button id="logout-btn" class="btn btn-secondary">Se Déconnecter</button>
                </div>
            </div>
        </div>

        <section class="course-grid">
            <h2>Chapitres</h2>
            <div class="chapters">
                <!-- Injecté dynamiquement par index.js -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 - Site pédagogique interactif</p>
        </div>
    </footer>

    <!-- Masquer le footer dans un contexte iframe (ex: vue formateur dans Electron) -->
    <script>
    if (window.self !== window.parent) {
        var f = document.querySelector('footer');
        if (f) f.style.display = 'none';
    }
    </script>

    <script src="../../src/js/storage.js"></script>
    <script src="../../src/js/studentProgressBridge.js"></script>
    <script src="../../src/js/dataStorage.js"></script>
    <script src="../../src/js/main.js"></script>
    <script src="../../src/js/core/bareme.js"></script>
    <script src="../../src/js/aide.js"></script>
    <script src="../../src/js/progressManager.js"></script>
    <script src="../../src/js/core/getExamContext.js"></script>
    <script src="../../src/js/core/utils.js"></script>
    <script src="../../src/js/chapitre.js"></script>
    <script src="../../src/js/chapter/chapterBilan.js"></script>
    <script src="../../src/js/correctionModal.js"></script>
    <script src="../../src/js/studentCorrectionModal.js"></script>
    <script src="../../src/js/index.js" type="module"></script>

    <script>
    async function showChapterDetails(chapterId) {
        const token = Parcours.token;
        if (!token) { alert('Veuillez vous connecter.'); return; }
        const auth     = new DataStorage();
        const progress = await auth.getStudentProgress() || {};
        if (typeof showDetailsBilanChapter === 'function') {
            showDetailsBilanChapter(chapterId, progress);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const slug   = Parcours.slug;
        const token  = Parcours.token;

        console.log('[user] DOMContentLoaded — slug=' + slug + ' token=' + (token || 'null'));

        if (!token) {
            console.log('[user] Aucun token → redirection login');
            window.location.replace(Parcours.loginUrl);
            return;
        }

        // Récupération directe via _storageProvider.get() comme dans login.html
        // (évite la boucle due au cache périmé de storage.get())
        const usersKey = slug + ':teacher:users_list';
        console.log('[user] Récupération users via _storageProvider.get("' + usersKey + '")');

        // Vider le cache localStorage pour forcer une vraie lecture provider
        localStorage.removeItem('_cache_' + usersKey);

        let users = [];
        let provider = window._storageProvider;
        if (!provider) {
            console.warn('[user] _storageProvider non disponible, fallback storage.init()');
            try {
                await storage.init();
                provider = window._storageProvider;
            } catch(e) {
                console.error('[user] storage.init() échoué:', e);
            }
        }
        if (provider) {
            try {
                users = await provider.get(usersKey) || [];
                console.log('[user] _storageProvider.get retourné ' + users.length + ' utilisateurs');
            } catch(e) {
                console.error('[user] Erreur _storageProvider.get:', e);
            }
        } else {
            console.error('[user] Aucun provider disponible');
        }

        const student = users.find(u => u.id === token);
        console.log('[user] student trouvé:', student ? student.name : 'NON (→ boucle potentielle)');

        if (!student) {
            console.log('[user] Student introuvable → redirection login');
            window.location.replace(Parcours.loginUrl);
            return;
        }

        document.body.style.opacity = '1';

        const data = await staticJson.get('/parcours/cours.json');
        if (data) {
            const meta = (data.parcours || []).find(p => p.slug === Parcours.slug);
            if (meta) document.getElementById('parcours-title').textContent = meta.label;
        }

        document.getElementById('student-info').style.display = 'block';
        document.querySelector('.student-name').textContent  = student.name;
        document.querySelector('.student-class').textContent = student.class || '';

        document.getElementById('logout-btn').addEventListener('click', () => {
            Parcours.logout();
        });
    });
    </script>
</body>
</html>
