<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapitre</title>
    <link rel="icon" href="data:,">

    <script>window._ELECTRON_DEPTH = 2;</script>
    <link rel="stylesheet" href="../../src/assets/css/style.css">
    <link rel="stylesheet" href="../../src/assets/css/chapitre.css">
    <link rel="stylesheet" href="../../src/assets/css/chapter-bilan.css">
    
    <script src="../../src/js/config.js"></script>
    <script src="../../src/js/simulation.js"></script>
    <script src="../../src/js/parcours.js"></script>
    <script src="../../src/js/storage.js"></script>
    <script src="../../src/js/studentProgressBridge.js"></script>
    <script src="../../src/js/dataStorage.js"></script>
    <script src="../../src/js/main.js"></script>
    <script src="../../src/js/core/bareme.js"></script>
    <script src="../../src/js/progressManager.js"></script>
    <script src="../../src/js/core/getExamContext.js"></script>
    <script src="../../src/js/core/utils.js"></script>
    <script src="../../src/js/core/chapterSession.js"></script>
    <script src="../../src/js/studentWorkEditor.js"></script>
    <script src="../../src/js/atelier/atelierCodes.js"></script>
    <script src="../../src/js/atelier/atelierQuestion.js"></script>
    <script src="../../src/js/vendor/qrcode-generator.js"></script>
    <script src="../../src/js/qrCharge.js"></script>
    <script src="../../src/js/qrQuestion.js"></script>
    <script src="../../src/js/chapter/chapterUI.js"></script>
    <script src="../../src/js/chapter/chapterOrdre.js"></script>
    <script src="../../src/js/chapter/chapterPagination.js"></script>
    <script src="../../src/js/chapter/chapterSubmission.js"></script>
    <script src="../../src/js/chapter/chapterBilan.js"></script>
    <script src="../../src/js/chapitre.js"></script>
    <script src="../../src/js/correctionModal.js"></script>
    <script src="../../src/js/studentCorrectionModal.js"></script>
    <script src="../../src/js/chapterInit.js"></script>
</head>
<body class="chapter-page">
    <div class="container">
        <header class="chapter-header">
            <div class="chapter-header-spacer"></div>
            <div class="chapter-header-content">
                <h1 id="chapter-title">Chargement...</h1>
            </div>
            <div class="chapter-progress-circle" id="chapterProgressCircle">
                <div class="progress-percent-bg">%</div>
                <div class="progress-percent-bg-dup0">%</div>
                <div class="progress-percent-bg-dup1">%</div>
                <div class="progress-value" id="chapterProgressValue">0</div>
            </div>
        </header>

        <div id="student-info" class="student-info" style="display: none;">
            <div class="welcome-message">
                <div class="student-details">
                    <div class="student-info-left">
                        <span class="student-name"></span>
                        <span class="student-class"></span>
                    </div>
                    <div class="chapter-nav">
                        <button id="back-to-menu" class="btn btn-secondary">
                            ← Retour au menu
                        </button>
                        <button id="logout-btn" class="btn btn-secondary">
                            Se déconnecter
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <main class="chapter-content">
            <div class="loader" id="chapter-loader">Chargement du chapitre...</div>
        </main>

        <footer class="chapter-footer"></footer>
    </div>

    <script type="module" src="../../src/js/cours-loader.js"></script>
    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        const parcoursSlug = urlParams.get('parcours');
        const chapitreId   = urlParams.get('chapitre');

        if (!parcoursSlug || !chapitreId) {
            window.location.href = (window.BASE || '') + '/src/html/user.html?parcours=' + parcoursSlug;
        }

        window.currentParcoursSlug = parcoursSlug;
        window.currentChapitreId   = chapitreId;

        const chapitre = await window.getChapitre(parcoursSlug, chapitreId);

        if (!chapitre) {
            document.getElementById('chapter-loader').textContent = '❌ Chapitre introuvable.';
        } else {
            document.getElementById('chapter-title').textContent = chapitre.title;
            document.title = chapitre.title;

            const main = document.querySelector('.chapter-content');
            // Ne jamais afficher une question incohérente (ex: QCM sans options) — cf. isQuestionValid().
            const itemsHtml = (chapitre.items || [])
                .filter(item => item._type !== 'question' || window.isQuestionValid(item))
                .map(item => item._html || '')
                .join('');
            const globalValidation = `
                <div class="global-validation hidden">
                    <button class="btn btn-primary" onclick="window.studentWorkEditor.validateAllQuestions()">
                        ✅ Valider toutes les réponses
                    </button>
                    <div id="global-feedback" class="feedback"></div>
                </div>
            `;
            main.innerHTML = itemsHtml + globalValidation;

            // L'ordre des questions peut être tiré au sort (modes Examen, Blind,
            // Millionnaire — voir chapterOrdre.js). Le réordonnancement ne peut avoir
            // lieu qu'une fois la progression chargée, donc après cette injection : on
            // masque les questions le temps de ce court instant, sans quoi l'ordre
            // publié s'afficherait avant de changer sous les yeux de l'apprenant.
            // Filet de sécurité : le contenu réapparaît même si le script échoue.
            main.classList.add('questions-en-attente');
            setTimeout(() => main.classList.remove('questions-en-attente'), 4000);
        }

        // Défensif : ce bouton peut être absent (page partielle, simulation…). Une
        // exception ici empêcherait initChapterPage() plus bas de s'exécuter, donc la
        // page entière resterait non initialisée pour un bouton manquant.
        const boutonRetour = document.getElementById('back-to-menu');
        if (boutonRetour) {
            boutonRetour.onclick = () => {
                window.location.href = (window.BASE || '') + '/src/html/user.html?parcours=' + parcoursSlug;
            };
        }

        if (typeof initChapterPage === 'function') {
            await initChapterPage();
        }
    </script>
</body>
</html>
