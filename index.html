<!-- index.html-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Interactifs</title>
  <script>
    var _base = (function() {
    // index.html vit TOUJOURS à la racine du site : sa base est donc son propre
    // dossier, et il n'y a rien d'autre à deviner.
    //
    // Cette fonction rendait '/cours-interactifs' EN DUR dès qu'on n'était ni en
    // local ni sous file:. Le site ne pouvait donc vivre que dans un dépôt portant
    // ce nom exact, alors que le formateur choisit le sien. Le symptôme aurait été
    // brutal : aucun script chargé, page blanche, avant même que config.js — qui a
    // reçu le même correctif — ait eu son mot à dire. Deux endroits déduisent la
    // base ; un seul avait été corrigé.
    if (window.location.protocol === 'file:' || !window.location.hostname) return '';
    return window.location.pathname
        .replace(/\/index\.html$/, '')
        .replace(/\/+$/, '');
})();
    document.write('<script src="' + _base + '/src/js/config.js"><\/script>');
    document.write('<script src="' + _base + '/src/js/parcours.js"><\/script>');
  </script>
</head>
<body>
  <script>
    (function () {
      var path = window.location.pathname;

      if (path.indexOf('/admin') !== -1) {
        window.location.replace(BASE + '/src/html/teacher-login.html');
        return;
      }

      // Cette page sert uniquement de point d'entrée racine (login/404 fallback).
      // Les redirections vers les slugs sont gérées par login.html (après connexion)
      // qui redirige directement vers chapter_template.html?parcours=...&chapitre=1.
      var slug = window.Parcours ? window.Parcours.slug : null;
      var token = window.Parcours ? window.Parcours.token : null;

      if (slug && token) {
        // Déjà authentifié → rediriger vers le 1er chapitre (évite boucle 404)
        window.location.replace(BASE + '/parcours/src/chapter_template.html?parcours=' + slug + '&chapitre=1');
      } else if (slug) {
        window.location.replace(BASE + '/src/html/login.html?parcours=' + slug);
      } else {
        window.location.replace(BASE + '/src/html/login.html');
      }
    })();
  </script>
</body>
</html>
